# Inter-Geo Self-Contained Nginx Configuration
# Can be run directly without root/sudo:
#   nginx -p /home/harvey/inter-geo -c /home/harvey/inter-geo/nginx.conf
# Or via npm scripts:
#   npm run nginx:start
#   npm run nginx:stop

worker_processes auto;
pid /tmp/inter_geo_nginx.pid;
error_log /tmp/inter_geo_nginx_error.log warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    types {
        application/octet-stream fgb;
        text/markdown md;
        text/csv csv;
    }

    access_log /tmp/inter_geo_nginx_access.log;

    # Unprivileged temporary paths
    client_body_temp_path /tmp/inter_geo_nginx_client_body;
    proxy_temp_path       /tmp/inter_geo_nginx_proxy;
    fastcgi_temp_path     /tmp/inter_geo_nginx_fastcgi;
    uwsgi_temp_path       /tmp/inter_geo_nginx_uwsgi;
    scgi_temp_path        /tmp/inter_geo_nginx_scgi;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Gzip compression for faster asset delivery
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/csv
        text/markdown
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml
        application/wasm;

    server {
        listen 8080;
        server_name localhost 127.0.0.1;

        # Redirect root to /inter-geo/
        location = / {
            return 302 /inter-geo/;
        }

        # ------------------------------------------------------------------
        # 1. Inter-Geo Data API (@geo-data)
        # ------------------------------------------------------------------

        # Index branch files (*-index.json located in inter-geo-data/dist-index/)
        location /inter-geo/@geo-data/index/ {
            alias /home/harvey/inter-geo-data/dist-index/;
            autoindex off;
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
            add_header Access-Control-Allow-Headers "*" always;
            add_header Cache-Control "no-cache, must-revalidate" always;

            if ($request_method = OPTIONS) {
                return 204;
            }
        }

        # Main branch files (data/, layers/, info/, images/ in inter-geo-data/)
        location /inter-geo/@geo-data/main/ {
            alias /home/harvey/inter-geo-data/;
            autoindex off;
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
            add_header Access-Control-Allow-Headers "*" always;
            add_header Cache-Control "no-cache, must-revalidate" always;

            if ($request_method = OPTIONS) {
                return 204;
            }
        }

        # Fallback for un-prefixed @geo-data requests
        location /inter-geo/@geo-data/ {
            alias /home/harvey/inter-geo-data/;
            autoindex off;
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
            add_header Access-Control-Allow-Headers "*" always;
            add_header Cache-Control "no-cache, must-revalidate" always;

            if ($request_method = OPTIONS) {
                return 204;
            }
        }

        # ------------------------------------------------------------------
        # 2. Static Web Application (inter-geo/dist/)
        # ------------------------------------------------------------------

        # Static hashed assets (JS, CSS, WASM, Web Workers) - long-term immutable cache
        location /inter-geo/assets/ {
            alias /home/harvey/inter-geo/dist/assets/;
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
        }

        # Root SPA Application & HTML fallback
        location /inter-geo/ {
            alias /home/harvey/inter-geo/dist/;
            index index.html;
            try_files $uri $uri/ /inter-geo/index.html;
            add_header Cache-Control "no-cache, must-revalidate";
        }
    }
}
